<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA WC 2026 Live</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
body{background:#0f172a;color:#fff;font-family:Arial;margin:0}
header{text-align:center;padding:20px;background:#111827}
#countdown{text-align:center;padding:10px;color:#22c55e}
#search{display:block;margin:15px auto;padding:10px;width:90%;max-width:500px}
video{width:95%;max-width:1000px;display:block;margin:auto}
.channels{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;padding:20px}
.channel{background:#1e293b;padding:15px;border-radius:10px;cursor:pointer;text-align:center}
.light{background:#fff;color:#000}
</style>
</head>
<body>
<header>
<h1>🏆 FIFA WC 2026 Live TV</h1>
<button onclick="toggleTheme()">Theme</button>
<button onclick="fullscreenPlayer()">Fullscreen</button>
</header>
<div id="countdown"></div>
<video id="video" controls autoplay></video>
<div id="status" style="text-align:center;padding:10px">Select Channel</div>
<input id="search" placeholder="Search Channel..." onkeyup="searchChannel()">
<div class="channels">
<div class="channel" onclick="playStream('https://owrcovcrpy.gpcdn.net/bpk-tv/1701/output/index.m3u8','Jamuna TV')">Jamuna TV</div>
<div class="channel" onclick="playStream('https://owrcovcrpy.gpcdn.net/bpk-tv/1703/output/index.m3u8','News24')">News24</div>
<div class="channel" onclick="playStream('https://owrcovcrpy.gpcdn.net/bpk-tv/1723/output/index.m3u8','Channel i')">Channel i</div>
<div class="channel" onclick="playStream('https://37b4c228.wurl.com/manifest/f36d25e7e52f1ba8d7e56eb859c636563214f541/UmFrdXRlblRWLWZyX0ZJRkFQbHVzRnJlbmNoX0hMUw/6f5437c5-e015-4754-8476-c8c6d27d3a55/1.m3u8','FIFA TV')">FIFA TV</div>
</div>
<script>
let video=document.getElementById('video'); let hls;
function playStream(url,name){
document.getElementById('status').innerText='Loading '+name;
if(hls){hls.destroy();}
if(Hls.isSupported()){
hls=new Hls(); hls.loadSource(url); hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
hls.on(Hls.Events.ERROR,()=>setTimeout(()=>playStream(url,name),5000));
}
localStorage.setItem('favorite',name);
}
function searchChannel(){
let v=document.getElementById('search').value.toLowerCase();
document.querySelectorAll('.channel').forEach(c=>c.style.display=c.innerText.toLowerCase().includes(v)?'block':'none');
}
function toggleTheme(){document.body.classList.toggle('light');}
function fullscreenPlayer(){if(video.requestFullscreen)video.requestFullscreen();}
const wcDate=new Date('2026-06-11');
setInterval(()=>{let d=Math.floor((wcDate-new Date())/86400000);document.getElementById('countdown').innerText='World Cup Starts In '+d+' Days';},1000);
if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js');}
</script>
</body>
</html>
